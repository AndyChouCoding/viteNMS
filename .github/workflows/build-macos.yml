name: Build macOS App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Apple Silicon only: GitHub's Intel macOS hosted runner (macos-13) has no
  # available capacity, so a universal (Intel + Apple Silicon) build isn't
  # feasible on hosted runners right now. Revisit if that changes.
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      # PyInstaller cannot cross-compile: this must run on macOS.
      - name: Freeze backend with PyInstaller
        working-directory: backend
        run: uv run pyinstaller pyinstaller/backend.spec

      # Tauri's sidecar convention requires the binary name to carry the
      # target-triple suffix; see tauri.conf.json's bundle.externalBin.
      - name: Stage backend sidecar for Tauri
        run: |
          mkdir -p src-tauri/binaries
          chmod +x backend/dist/nms-vite-backend
          cp backend/dist/nms-vite-backend src-tauri/binaries/nms-vite-backend-aarch64-apple-darwin

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Not code-signed/notarized (no Apple Developer account yet), so
      # Gatekeeper will flag the app as from an unidentified developer;
      # users need to right-click > Open (or `xattr -cr`) on first launch.
      - name: Build Tauri app
        run: npx tauri build --target aarch64-apple-darwin

      # Release notes come from CHANGELOG.md's section for this tag, kept in
      # sync manually per the project's release process, rather than GitHub's
      # auto-generated commit list.
      - name: Extract changelog section for this tag
        shell: bash
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[v" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          body_path: RELEASE_NOTES.md
