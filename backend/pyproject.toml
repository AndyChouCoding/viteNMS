[project]
name = "backend"
version = "1.0.0"
description = "NMS Vite backend: localhost-only FastAPI service for SNMP/LLDP topology discovery and device monitoring"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=49.0.0",
    "fastapi>=0.140.0",
    "keyring>=25.7.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.2",
    "pysnmp>=7.1.27",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is Depends(...)/require_role(...) in
# argument defaults — B008 exists to catch actually-mutable default args,
# not this pattern, so these calls are exempted rather than suppressed
# line-by-line everywhere they appear.
extend-immutable-calls = ["fastapi.Depends", "app.core.security.dependencies.require_role"]
