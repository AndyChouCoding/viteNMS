[project]
name = "backend"
version = "0.1.0"
description = "Open Vision Vite backend: localhost-only FastAPI service for SNMP/LLDP topology discovery and device monitoring"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi>=0.140.0",
    "keyring>=25.7.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.2",
    "pysnmp>=7.1.27",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
